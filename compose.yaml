services:
  collector-pos:
    build: .
    image: collector-pos:2.3-pilot
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      JUSTTCG_API_KEY: ${JUSTTCG_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY}
      DATA_DIR: /app/data
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-1}
    volumes:
      - ./data:/app/data

  price-updater:
    image: collector-pos:2.3-pilot
    restart: unless-stopped
    depends_on:
      - collector-pos
    command: ["python", "price_scheduler.py"]
    environment:
      JUSTTCG_API_KEY: ${JUSTTCG_API_KEY:-}
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data

  backup-scheduler:
    image: collector-pos:2.3-pilot
    restart: unless-stopped
    depends_on:
      - collector-pos
    command: ["python", "backup_scheduler.py"]
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
