<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar administrador · Collector POS</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body class="auth-body"><main class="auth-card panel"><img src="{{ url_for('brand_logo') }}" class="auth-logo" alt=""><div class="eyebrow">PRIMER INICIO</div><h1>Crea el administrador</h1><p>Este será el primer usuario con acceso completo a configuración, inventario, devoluciones y empleados.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="auth-form"><label>Nombre<input name="name" placeholder="Nombre del administrador" required autofocus></label><label>PIN de 4 a 8 números<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" required></label><label>Confirmar PIN<input name="pin_confirm" type="password" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" required></label><button class="btn primary checkout-btn">Crear administrador</button></form></main></body></html>
