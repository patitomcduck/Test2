{% extends 'base.html' %}{% block title %}Nuevo producto · {{ store.store_name }}{% endblock %}{% block content %}<div class="form-page"><div class="section-head page-title"><div><div class="eyebrow">INVENTARIO</div><h1>Agregar coleccionable</h1><p>Para Hot Wheels, Funkos, figuras, cómics u otros productos que no vienen de una API TCG.</p></div><a class="btn secondary" href="{{ url_for('inventory') }}">Volver</a></div><form class="panel form-card" method="post"><div class="form-grid two"><label>Nombre<input name="name" required autofocus></label><label>SKU<input name="sku" placeholder="Déjalo vacío para generarlo"></label></div><div class="form-grid two"><label>Categoría<select name="category"><option>Hot Wheels</option><option>Funko</option><option value="Figure">Figuras</option><option value="Comics">Cómics</option><option value="Video Games">Videojuegos</option><option value="Other" selected>Otro</option></select></label><label>Subcategoría<input name="subcategory" placeholder="Opcional"></label></div><div class="form-grid three"><label>Cantidad<input name="qty" type="number" min="0" value="1"></label><label>Costo unitario MXN<input name="cost_mxn" type="number" min="0" step="0.01" value="0"></label><label>Precio de venta MXN<input name="price_mxn" type="number" min="0" step="0.01" value="0"></label></div><label>Proveedor inicial (opcional)<input name="supplier" placeholder="Distribuidor / persona"></label><label>Notas<textarea name="notes" rows="4"></textarea></label><button class="btn primary" style="margin-top:16px">Guardar producto</button></form></div>{% endblock %}
