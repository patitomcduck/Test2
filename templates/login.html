<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · {{ store.store_name }}</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"><style>:root{--primary:{{ store.primary_color }};--secondary:{{ store.secondary_color }};--accent:{{ store.accent_color }};--green:var(--primary);--purple:var(--secondary);--blue:var(--accent);}</style></head>
<body class="auth-body"><main class="auth-card panel"><img src="{{ url_for('brand_logo') }}" class="auth-logo" alt=""><div class="eyebrow">COLLECTOR POS</div><h1>¿Quién está usando la caja?</h1><p>Selecciona tu usuario e ingresa tu PIN.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="auth-form"><input type="hidden" name="next" value="{{ request.args.get('next','') }}"><label>Usuario<select name="user_id" required>{% for u in users %}<option value="{{ u.id }}">{{ u.name }} · {{ role_label[u.role] }}</option>{% endfor %}</select></label><label>PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="current-password" required autofocus></label><button class="btn primary checkout-btn">Entrar</button></form></main></body></html>
